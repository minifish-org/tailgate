[package]
name = "tailgate"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "tailgate"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
bytes = "1.7"
dotenvy = "0.15"
futures-util = "0.3"
http = "1.1"
http-body-util = "0.1"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["macros", "net", "rt", "signal", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.12"
