server:
  host: 0.0.0.0
  port: 11435
  cors_allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
    # Use "*" only when tailgate is reachable from trusted networks such as Tailscale.
    # - "*"

sync:
  openrouter: false
  deepseek: false
  interval_seconds: 21600

routing:
  network_ms_max: 250
  first_token_ms_max: 5000

pricing:
  standard_max_usd_per_1m_tokens: 2

local:
  base_url: http://macbook-pro:8000/v1
  api_key_env: LOCAL_API_KEY
  chat_model: local-llm
  embedding_model: local-embedding
  tts_model: local-tts
  tts_quality_model: local-tts-quality
  tts_voice_design_model: local-tts-voice-design
  asr_model: local-asr
  translation_model: local-translation
  context_window: 8192
  max_concurrency: 1

deepseek:
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-flash
  premium_model: deepseek-v4-pro
  context_window: 64000
  premium_context_window: 64000

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  free_model: openrouter/free
  standard_model: openrouter/auto
  premium_model: anthropic/claude-sonnet-4
  standard_context_window: 128000
  premium_context_window: 200000
