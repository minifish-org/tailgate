server:
  host: 0.0.0.0
  port: 11435
  request_timeout_ms: 60000

models:
  local/chat:
    provider: local
    upstream_model: local-llm
    base_url: http://macbook-pro:8000/v1
    api_key_env: LOCAL_API_KEY
    endpoint: chat
    capabilities:
      general: 1
      coding: 1
      private: true
    cost_tier: free
    price_rank: 0
    context_window: 8192
    max_concurrency: 1

  deepseek/chat:
    provider: deepseek
    upstream_model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    endpoint: chat
    capabilities:
      general: 2
      coding: 2
      reasoning: 2
    cost_tier: standard
    price_rank: 10
    context_window: 64000

  openrouter/default:
    provider: openrouter
    upstream_model: openrouter/auto
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    endpoint: chat
    capabilities:
      general: 2
      coding: 2
      reasoning: 2
    cost_tier: standard
    price_rank: 20
    context_window: 128000

routes:
  auto/private:
    endpoint: chat
    required_capabilities:
      general: 1
    require_private: true
    allow_external: false
    max_cost_tier: free
    optimize: cheapest

  auto/default:
    endpoint: chat
    required_capabilities:
      general: 1
    allow_external: true
    max_cost_tier: standard
    optimize: cheapest
