server:
  host: 0.0.0.0
  port: 11435
  request_timeout_ms: 60000
  fallback_max_attempts: 2

openrouter_sync:
  enabled: false
  interval_seconds: 21600
  update_config_file: false
  source_url: https://openrouter.ai/api/v1/models
  include_unconfigured_models: false
  allowlist:
    - openrouter/auto
    - openrouter/free
    - deepseek/deepseek-chat
    - anthropic/claude-sonnet-4
  cost_tiers:
    free_max_usd_per_1m_tokens: 0
    standard_max_usd_per_1m_tokens: 2
    premium_max_usd_per_1m_tokens: 9999

deepseek_sync:
  enabled: false
  interval_seconds: 21600
  source_url: https://api-docs.deepseek.com/quick_start/pricing/
  cost_tiers:
    free_max_usd_per_1m_tokens: 0
    standard_max_usd_per_1m_tokens: 2
    premium_max_usd_per_1m_tokens: 9999

routing:
  latency:
    network_ms_max: 250
    first_token_ms_max: 5000

models:
  local/chat:
    provider: local
    upstream_model: local-llm
    base_url: http://macbook-pro:8000/v1
    api_key_env: LOCAL_API_KEY
    endpoint: chat
    context_window: 8192
    max_concurrency: 1

  local/embedding:
    provider: local
    upstream_model: local-embedding
    base_url: http://macbook-pro:8000/v1
    api_key_env: LOCAL_API_KEY
    endpoint: embeddings
    max_concurrency: 1

  local/tts:
    provider: local
    upstream_model: local-tts
    base_url: http://macbook-pro:8000/v1
    api_key_env: LOCAL_API_KEY
    endpoint: audio_speech
    max_concurrency: 1

  local/asr:
    provider: local
    upstream_model: local-asr
    base_url: http://macbook-pro:8000/v1
    api_key_env: LOCAL_API_KEY
    endpoint: audio_transcriptions
    max_concurrency: 1

  deepseek/chat:
    provider: deepseek
    upstream_model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    endpoint: chat
    context_window: 64000

  openrouter/auto:
    provider: openrouter
    upstream_model: openrouter/auto
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    endpoint: chat
    context_window: 128000

  openrouter/premium:
    provider: openrouter
    upstream_model: anthropic/claude-sonnet-4
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    endpoint: chat
    context_window: 200000

# Built-in routes are available without declaring routes:
# local/chat, local/embedding, local/tts, local/asr are concrete local models.
# free/chat, free/embedding, free/tts, free/asr select free models.
# standard/chat, standard/embedding, standard/tts, standard/asr select standard models.
# premium/chat, premium/embedding, premium/tts, premium/asr select premium models.
